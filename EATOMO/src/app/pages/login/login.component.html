<div class="logo-bar" routerLink="/">
  <img src="/assets/healthy/images/index/image-removebg-preview (36).png" alt="Brand Logo">
  <h1>EATOMO</h1>
</div>

<div class="login-container">
  <div class="login-box register-box">

    @if (mode() === 'user') {
      <h2>Login</h2>

      @if (userError()) {
        <div class="alert alert-error">
          {{ userError() }}
        </div>
      }

      <form [formGroup]="userForm" (ngSubmit)="onUserLogin()">
        <div class="form-group">
          <label>Username</label>
          <input formControlName="username" placeholder="Enter your username">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password" placeholder="Enter your password">
        </div>

        <button type="submit">Login</button>
      </form>

      <button class="secondary-btn" (click)="switchToAdmin()">
        Login as Admin
      </button>
    }

    @if (mode() === 'admin') {
      <h2>Admin Login</h2>

      @if (adminError()) {
        <div class="alert alert-error">
          {{ adminError() }}
        </div>
      }

      <form [formGroup]="adminForm" (ngSubmit)="onAdminLogin()">
        <div class="form-group">
          <label>Admin Username</label>
          <input formControlName="username" placeholder="Enter admin username">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password" placeholder="Enter admin password">
        </div>

        <button type="submit">Login</button>
      </form>

      <button class="secondary-btn" (click)="switchToUser()">
        Back to User Login
      </button>
    }

    <p class="login-link">
      Don't have an account? <a routerLink="/register">Register here</a>
    </p>
  </div>
</div>
